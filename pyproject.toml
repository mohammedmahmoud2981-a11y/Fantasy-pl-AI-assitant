[project]
name = "fantasyiq-api"
version = "0.2.0"
description = "FantasyIQ FastAPI backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas>=2.2",
    "requests>=2.32",
    "scipy>=1.13",
    "scikit-learn==1.9.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "backend.main:app"
